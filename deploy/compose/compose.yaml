name: fluent-task-runtime

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  runtime:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SOURCE_REVISION: ${TASK_RUNTIME_SOURCE_REVISION:-unknown}
    ports:
      - "127.0.0.1:${RT_HTTP_PORT:-48227}:48227"
    logging: *json-logging
    environment:
      RUNTIME_PORT: "48227"
      SOURCE_REVISION: ${TASK_RUNTIME_SOURCE_REVISION:-unknown}
      FEL_RELEASE_ID: ${TASK_RUNTIME_RELEASE_ID:-unreleased}
      FEL_ENVIRONMENT: ${FEL_ENVIRONMENT:-local-compose}
      OTEL_SERVICE_NAME: fluent-task-runtime
      # The workspace owns one Jaeger (Question Brain, host OTLP/gRPC 54317).
      # Override RT_OTLP_ENDPOINT when running this repository standalone.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${RT_OTLP_ENDPOINT:-host.docker.internal:54317}"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # The nested Docker CLI asks the host daemon to mount this exact path.
      # Keep the container path equal to the host path so `docker compose up`
      # works without a hand-written .env file; override it only when running
      # a second stack.
      RUNTIME_WORK_ROOT: "${RUNTIME_HOST_WORK_ROOT:-${PWD}/.runtime-work}"
      # Explicit release input. An empty value is intentionally degraded; it
      # must never silently select a historical descriptor or fallback.
      RUNTIME_RELEASE_MANIFEST: "${RUNTIME_RELEASE_MANIFEST:-/opt/releases/task-release-2026-08-26-qb-d00a1493-g10.json}"
      RUNTIME_TASK_FAMILY_MANIFEST: "${RUNTIME_TASK_FAMILY_MANIFEST:-/opt/task-families/manifest.json}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Local execution only: the runtime is the policy gate, while Docker is a
    # disposable sandbox provider. Production should replace this socket with
    # a dedicated sandbox service or remote worker boundary.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNTIME_HOST_WORK_ROOT:-${PWD}/.runtime-work}:${RUNTIME_HOST_WORK_ROOT:-${PWD}/.runtime-work}
      - ../../releases:/opt/releases:ro
      - ../../task-families:/opt/task-families:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
