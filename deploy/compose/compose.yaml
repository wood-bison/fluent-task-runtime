name: fluent-task-runtime

services:
  runtime:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    ports:
      - "48227:48227"
    environment:
      RUNTIME_PORT: "48227"
      RUNTIME_EXECUTION_ENABLED: "true"
      OTEL_SERVICE_NAME: fluent-task-runtime
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Set this to the same absolute host path used as the bind source below
      # when you want nested task containers to execute in local Compose.
      RUNTIME_WORK_ROOT: "${RUNTIME_HOST_WORK_ROOT:-/runtime-work}"
    depends_on:
      jaeger:
        condition: service_started
    # Local execution only: the runtime is the policy gate, while Docker is a
    # disposable sandbox provider. Production should replace this socket with
    # a dedicated sandbox service or remote worker boundary.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNTIME_HOST_WORK_ROOT:-./.runtime-work}:${RUNTIME_HOST_WORK_ROOT:-/runtime-work}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    read_only: true
    security_opt:
      - no-new-privileges:true

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "56687:16686"
      - "14317:4317"
      - "14318:4318"
